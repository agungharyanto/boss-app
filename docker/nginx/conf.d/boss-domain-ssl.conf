# v0.8.4 — boss.bajastu.id over HTTPS. Added only after the certificate
# genuinely exists on disk (see boss-domain.conf's own docblock for why
# this couldn't be in the same file/rollout step as the port 80 block).
server {
    listen 443 ssl;
    http2 on;
    server_name boss.bajastu.id;

    ssl_certificate /etc/letsencrypt/live/boss.bajastu.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boss.bajastu.id/privkey.pem;

    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass boss-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Laravel/Fortify needs this to know the ORIGINAL request was
        # HTTPS (this server block itself terminates TLS — php-fpm has no
        # other way to know) — otherwise generated absolute URLs, secure
        # cookie flags, etc. would silently assume plain HTTP.
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/boss-app-ssl.access.log;
    error_log  /var/log/nginx/boss-app-ssl.error.log;
}
