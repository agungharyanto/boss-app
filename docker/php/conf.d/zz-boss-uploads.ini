; v0.16.0 Langkah 6 — file upload limits.
;
; Root cause of the reported "The newPhotos.0 failed to upload." (fiber
; topology photo picker, verified on boss.bajastu.id): the php:8.4-fpm-alpine
; base image ships NO php.ini at all ("Loaded Configuration File: (none)"),
; so upload_max_filesize / post_max_size stayed at PHP's compiled defaults
; of 2M / 8M. A phone-camera JPEG routinely exceeds 2M, so PHP's SAPI
; rejects the file part (UPLOAD_ERR_INI_SIZE) BEFORE Livewire's
; /livewire/upload-file handler ever runs — Livewire then surfaces that to
; the browser as the "failed to upload" message. nginx was never involved
; (docker/nginx/nginx.conf already sets client_max_body_size 20M), and
; storage/app/private is correctly www-data-owned.
;
; zz- prefix so it's parsed last in conf.d and wins over any base default.
; Loaded as a single-file bind mount (docker-compose.yml) — NOT a directory
; mount, which would hide the docker-php-ext-*.ini files and break every
; extension.

upload_max_filesize = 20M
; post_max_size a touch above nginx's client_max_body_size headroom for
; multipart boundary overhead + a small multi-file batch.
post_max_size = 25M
memory_limit = 256M
max_file_uploads = 20
