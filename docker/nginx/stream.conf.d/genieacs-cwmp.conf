# v0.7.1 amendment — CPE devices dial this port to send TR-069 Inform
# requests. Previously fronted at the HTTP layer (proxy_pass in
# docker/nginx/conf.d/genieacs-cwmp.conf, now removed) — replaced with a
# raw TCP passthrough here because GenieACS's own Digest-auth
# implementation binds the challenge nonce to the specific inbound TCP
# socket object (As.get(e.httpRequest.socket) in bin/genieacs-cwmp), not
# to the device or IP. nginx's default proxy_pass (no upstream keepalive)
# opens a brand-new backend connection per request, so the follow-up
# authenticated retry always landed on a different backend socket than the
# one that issued the nonce — auth failed for every device, regardless of
# credentials. A stream-level passthrough keeps the CPE's one TCP
# connection mapped 1:1 to one genieacs-cwmp connection for the whole
# session, matching what GenieACS's nonce binding assumes. See CLAUDE.md
# "GenieACS Core (v0.7.1)" for the full investigation.
server {
    listen 7547;
    proxy_pass genieacs-cwmp:7547;
}
