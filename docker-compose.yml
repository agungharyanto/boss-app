name: boss-app

services:
  boss-nginx:
    image: nginx:1.27-alpine
    container_name: boss-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # v0.8.4 — boss.bajastu.id activation, TLS terpasang (Let's Encrypt
      # via certbot, lihat service `certbot` di bawah).
      - "443:443"
      # v0.7.1 — CPE devices dial this to reach genieacs-cwmp, fronted by
      # nginx rather than published on genieacs-cwmp itself directly (see
      # docker/nginx/conf.d/genieacs-cwmp.conf).
      - "7547:7547"
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/stream.conf.d:/etc/nginx/stream.conf.d:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    depends_on:
      - boss-app
      - genieacs-cwmp
    networks:
      - boss-network

  # v0.8.4 — Let's Encrypt certificate for boss.bajastu.id. Webroot mode
  # (not standalone) so it never needs its own listener/port — it just
  # writes ACME challenge files into the shared certbot_www volume, which
  # boss-nginx serves at /.well-known/acme-challenge/ on port 80 (see
  # docker/nginx/conf.d/boss-domain.conf). The daemon loop (`certbot
  # renew` every 12h, matching Certbot's own documented recommendation of
  # checking twice daily) is what actually stays running long-term — the
  # FIRST certificate is issued via a one-off `docker compose run --rm
  # certbot certonly ...` invocation (see docs/DEPLOYMENT.md), not by this
  # entrypoint itself, since certonly's own interactive-first-run shape
  # doesn't fit a long-lived container command.
  certbot:
    image: certbot/certbot:v2.11.0
    container_name: boss-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    networks:
      - boss-network

  boss-app:
    build:
      context: ./docker/php
    container_name: boss-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      # v0.6.2 — shared with the openvpn container. VpnProvisioningService
      # runs `easyrsa` (Process facade) directly against these to
      # issue/revoke OpenVPN client certs and write client-config-dir
      # files; see docker-compose.yml's openvpn service and CLAUDE.md "VPN
      # Server Node #1 (v0.6.2)" for why (no Docker socket mounted here —
      # that would be a much bigger hole than a shared data volume).
      # vpn-pki-data (not /vpn-pki directly) — the actual PKI lives in a
      # `pki/` subdirectory of this mount, never at the mount root itself.
      # `easyrsa init-pki` does an rm -rf hard-reset of --pki-dir on first
      # run, which fails with "Resource busy" if --pki-dir IS the volume's
      # own mountpoint (found by actually running this — see CLAUDE.md "VPN
      # Server Node #1 (v0.6.2)").
      - vpn_pki:/vpn-pki-data
      - vpn_ccd:/vpn-ccd
      # v0.6.3 — same shared-volume reasoning as vpn_pki/vpn_ccd above.
      # wireguard: keypair gen is pure crypto (Process facade, no live
      # interface needed) but PEER changes need the reconcile loop in the
      # wireguard container itself — see docker/wireguard/entrypoint.sh and
      # CLAUDE.md "Multi-Protocol VPN (v0.6.3)" for why `wg set` can't be
      # run from here directly. l2tp: VpnProvisioningService rewrites
      # chap-secrets wholesale on every provision()/revoke().
      - vpn_wg_data:/vpn-wg-data
      - vpn_l2tp_secrets:/vpn-l2tp-data
      # v0.6.5 — shared with the freeradius container. NasService writes
      # per-NAS listen/clients config here (FreeradiusVirtualServerService)
      # and CoaService queues CoA/Disconnect requests here — same
      # "communicate via a shared volume, no Docker socket" posture as
      # every other cross-container coordination in this stack. See
      # CLAUDE.md "FreeRADIUS Core & NAS Management" v0.6.5 section.
      - freeradius_nas_config:/freeradius-nas-config
      # v0.8.2 — read-only. LibreNmsService::getTrafficHistory() shells out
      # to `rrdtool xport --json` directly against LibreNMS's own RRD files
      # (LibreNMS's REST API has no raw time-series JSON endpoint in this
      # version — confirmed by reading its own routes/api.php). Same
      # "communicate via a shared volume, no Docker socket" posture as
      # every other cross-container coordination in this stack, this one
      # read-only since boss-app never writes LibreNMS's own poller data.
      # See CLAUDE.md "Dashboard Monitoring (v0.8.2)".
      - librenms_data:/librenms-data:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      TZ: Asia/Jakarta
    env_file:
      - .env
    depends_on:
      boss-postgresql:
        condition: service_healthy
      boss-redis:
        condition: service_healthy
    networks:
      - boss-network

  boss-worker:
    build:
      context: ./docker/php
    container_name: boss-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./app:/var/www/html
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      TZ: Asia/Jakarta
    env_file:
      - .env
    depends_on:
      - boss-app
    networks:
      - boss-network

  boss-whatsapp-worker:
    build:
      context: ./docker/php
    container_name: boss-whatsapp-worker
    restart: unless-stopped
    working_dir: /var/www/html
    # Separate from boss-worker: whatsapp-{session_key} is a dynamic queue
    # name (one per reseller + "direct"), which a static --queue= flag can't
    # enumerate ahead of time. --max-time=300 makes queue:work exit every 5
    # minutes so the loop re-runs `whatsapp:queue-names` and restarts with
    # any newly created reseller session's queue included — same
    # polling-restart style as boss-scheduler below, no manual restart
    # needed when a reseller's WhatsApp session is set up.
    # /entrypoint.sh (docker/php/entrypoint.sh) prefixed here — this
    # container's own `entrypoint:` override in compose bypasses the
    # image's Dockerfile ENTRYPOINT entirely, so it must invoke the
    # shared /tmp self-healing script explicitly rather than getting it
    # automatically the way boss-app/boss-worker do. See that script's
    # own docblock for why this matters.
    entrypoint: ["/entrypoint.sh", "sh", "-c", "while true; do php artisan queue:work --queue=$(php artisan whatsapp:queue-names) --sleep=3 --tries=3 --max-time=300; done"]
    volumes:
      - ./app:/var/www/html
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      TZ: Asia/Jakarta
    env_file:
      - .env
    depends_on:
      - boss-app
    networks:
      - boss-network

  boss-scheduler:
    build:
      context: ./docker/php
    container_name: boss-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    # Two independent loops, not one: the standard schedule:run loop below
    # handles everything registered in routes/console.php's Schedule
    # (1-minute granularity, matches real cron semantics since each
    # invocation gets its own fresh minute-aligned repeatEvents() window —
    # see routes/console.php's own comment on AutoMatchLegacyDevices for
    # why that assumption breaks for a sub-60s interval under THIS
    # container's while-loop invocation pattern). cpe:auto-match-legacy-
    # devices is deliberately run by its own dedicated backgrounded loop
    # instead, polling CPE_AUTO_MATCH_INTERVAL_SECONDS (root .env, default
    # 60 — currently 30 while Agung manually adds TR-069 profiles per-ONT
    # and wants faster feedback than the steady-state cadence) — change
    # cadence by editing that one .env value and recreating this container,
    # never by editing this entrypoint again.
    # /entrypoint.sh prefixed here for the same reason as
    # boss-whatsapp-worker above — this container's own `entrypoint:`
    # override bypasses the Dockerfile ENTRYPOINT entirely.
    entrypoint: ["/entrypoint.sh", "sh", "-c", "(while true; do php artisan cpe:auto-match-legacy-devices --no-interaction; sleep \"${CPE_AUTO_MATCH_INTERVAL_SECONDS:-60}\"; done) & while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    volumes:
      - ./app:/var/www/html
      # v0.6.4 — VpnCheckNodeHealth (routes/console.php, ->everyMinute())
      # is the scheduled command that actually READS these heartbeat files,
      # and schedule:run genuinely executes here, in boss-scheduler, not in
      # boss-app. Found via a real test: without these mounts,
      # config('services.vpn.pki_dir')/wg_peers_dir resolve to paths that
      # simply don't exist in THIS container, so every node's heartbeat
      # silently reads as "missing" and gets marked Offline regardless of
      # real status — same class of gap as v0.6.1-v0.6.3's other "container
      # X doesn't have the env/volume container Y assumed it would" bugs.
      - vpn_pki:/vpn-pki-data
      - vpn_wg_data:/vpn-wg-data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      TZ: Asia/Jakarta
    env_file:
      - .env
    depends_on:
      - boss-app
    networks:
      - boss-network

  # v0.8.4 Bagian C — the ONLY container that ever mounts the real Docker
  # socket (read-only). boss-app/boss-scheduler talk to THIS over plain
  # HTTP on boss-network (ContainerStatsService, DOCKER_STATS_PROXY_URL) —
  # neither of them ever mounts docker.sock directly, so a bug in
  # ContainerStatsService's own HTTP calls can't touch the real socket no
  # matter what. CONTAINERS=1 is the only endpoint family enabled; every
  # other family (POST/EXEC/NETWORKS/VOLUMES/IMAGES/SWARM/...) defaults to
  # 0/denied by this image itself — a mutating call is refused by the
  # PROXY, not merely avoided by application-code discipline. No host port
  # published (BOSS-010), same posture as freeradius/genieacs-cwmp/nbi.
  docker-stats-proxy:
    image: tecnativa/docker-socket-proxy:0.2
    container_name: docker-stats-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
      EXEC: 0
      NETWORKS: 0
      VOLUMES: 0
      IMAGES: 0
      INFO: 0
      SWARM: 0
      SYSTEM: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - boss-network

  whatsapp-gateway:
    build:
      context: ./whatsapp-gateway
    container_name: whatsapp-gateway
    restart: unless-stopped
    volumes:
      - ./whatsapp-gateway/auth_state:/app/auth_state
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      TZ: Asia/Jakarta
    env_file:
      - ./whatsapp-gateway/.env
    networks:
      - boss-network
    # No host port published — internal-only, reached by boss-app/
    # boss-whatsapp-worker via the boss-network service name (RULE
    # BOSS-010). boss-nginx does NOT proxy to this service either; it has
    # no public HTTP surface at all.

  freeradius-db:
    image: postgres:16-alpine
    container_name: freeradius-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RADIUS_DB_NAME}
      POSTGRES_USER: ${RADIUS_DB_USER}
      POSTGRES_PASSWORD: ${RADIUS_DB_PASSWORD}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - freeradius_postgres_data:/var/lib/postgresql/data
      # Standard FreeRADIUS Postgres schema (radcheck/radreply/radgroupcheck/
      # radgroupreply/radusergroup/radacct/radpostauth/nas) — applied once by
      # Postgres's own docker-entrypoint-initdb.d mechanism on first boot
      # (a non-empty data volume skips it, same as any other Postgres init
      # script).
      - ./docker/freeradius/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RADIUS_DB_USER} -d ${RADIUS_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - boss-network
    # Deliberately a SEPARATE Postgres container/instance from
    # boss-postgresql (BOSS-009: radius_db is logically separated from
    # boss_db, no cross-database joins) — root .env.example already reserved
    # a distinct RADIUS_DB_HOST placeholder for this since v0.1.0. Port 5432
    # NOT exposed to host (BOSS-010).

  freeradius:
    build:
      context: ./docker/freeradius
    container_name: freeradius
    restart: unless-stopped
    # v0.6.5 CoA/Disconnect — entrypoint.sh adds routes to the VPN node
    # subnets (via openvpn/wireguard's own boss-network IP as next-hop) so
    # CoaService's radclient calls can actually reach a NAS's internal_ip;
    # `ip route add` needs NET_ADMIN inside this container's own netns
    # (confirmed for real: failed with "Operation not permitted" without
    # it).
    cap_add:
      - NET_ADMIN
    environment:
      TZ: Asia/Jakarta
    env_file:
      - .env
    volumes:
      # v0.6.5 — shared with boss-app. entrypoint.sh mounts this at
      # /etc/raddb/nas-config (listen/ + clients/ read via $INCLUDE from
      # sites-enabled/default + clients.conf) and /coa-queue (CoaService
      # requests) — see docker/freeradius/entrypoint.sh.
      - freeradius_nas_config:/freeradius-nas-config
      # v0.8.1 fragment+reconcile — read-only, this container never writes
      # here (only boss-app's VpnSyncRouteFragments does). See CLAUDE.md's
      # "Fragment+Reconcile Routing" section.
      - vpn_wg_data:/vpn-wg-data:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    depends_on:
      freeradius-db:
        condition: service_healthy
    networks:
      boss-network:
        # Static IP (v0.6.2) — "FreeRADIUS selalu diakses di SATU IP
        # internal tetap dari sisi Mikrotik" is a locked architecture
        # decision (docs/ROADMAP.md), not just a convenience: the openvpn
        # container's push-route AND its iptables FORWARD allowlist are
        # both keyed off this exact address (FREERADIUS_INTERNAL_IP in
        # .env) — it must never silently drift to a different IP on
        # container recreation the way an unpinned bridge IP could.
        ipv4_address: ${FREERADIUS_INTERNAL_IP}
    # No host port published (BOSS-010) — nothing outside boss-network needs
    # to reach it yet. Real NAS/Mikrotik traffic arrives via the VPN
    # concentrator container (v0.6.2), which will join boss-network and
    # relay into freeradius:1812/1813/3799 internally; until then this
    # container just needs to be up and rlm_sql-healthy.
    healthcheck:
      # Status-Server round-trip against the stock "localhost" client from
      # clients.conf (secret "testing123", untouched default — real NAS
      # clients are v0.6.5 scope) — a genuine liveness check, not just "is
      # the process running": status_server=yes is FreeRADIUS's own default,
      # and an Access-Accept here means the virtual server AND rlm_sql (sql
      # is wired into authorize{}) both instantiated successfully.
      test: ["CMD-SHELL", "echo 'Message-Authenticator = 0x00' | /opt/bin/radclient -x 127.0.0.1:1812 status testing123 | grep -q Access-Accept"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # v0.8.1 — OSPF sidecar, CONSUMER role. Learns routes from the 3
  # frr-wireguard* nodes, never redistributes anything back. See
  # CLAUDE.md's OSPF section.
  # [v0.8.1 OSPF DISABLED — see CLAUDE.md "OSPF Dynamic Routing" for why. Kept for reference, not deleted.]
  # frr-freeradius:
  #   build:
  #     context: ./docker/frr
  #   container_name: frr-freeradius
  #   restart: unless-stopped
  #   network_mode: "service:freeradius"
  #   cap_add:
  #     - NET_ADMIN
  #     - NET_BROADCAST
  #     - NET_RAW
  #     - SYS_ADMIN
  #   environment:
  #     FRR_ROLE: consumer
  #     OSPF_HELLO_INTERVAL: ${OSPF_HELLO_INTERVAL:-1}
  #     OSPF_DEAD_INTERVAL: ${OSPF_DEAD_INTERVAL:-4}
  #     OSPF_AUTH_KEY: ${OSPF_AUTH_KEY}
  #   depends_on:
  #     - freeradius

  openvpn:
    build:
      context: ./docker/openvpn
    container_name: openvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      # One of the few services (besides boss-nginx 80/443) allowed a public
      # host port — real Mikrotik NAS devices connect to this from outside
      # boss-network entirely (BOSS-010 exception, by design). wireguard and
      # l2tp below are the same exception for their own protocols.
      - "1194:1194/udp"
    volumes:
      # Same /pki-data mount-root-vs-subdirectory reasoning as boss-app's
      # mount above — entrypoint.sh's PKI_DIR points at pki-data/pki, not
      # pki-data itself.
      - vpn_pki:/etc/openvpn/pki-data
      - vpn_ccd:/etc/openvpn/ccd
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      # v0.6.4 — matches VpnServersSeeder's hostname for this row; the
      # entrypoint's heartbeat loop writes a file named after this so
      # VpnCheckNodeHealth (boss-app, reading the same shared volume) can
      # tell which node a given heartbeat file belongs to.
      NODE_HOSTNAME: vpn-node-1
      TZ: Asia/Jakarta
    env_file:
      - .env
    networks:
      - boss-network
    depends_on:
      freeradius:
        condition: service_healthy

  wireguard:
    build:
      context: ./docker/wireguard
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "51820:51820/udp"
    volumes:
      - vpn_wg_data:/etc/wireguard
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      NODE_HOSTNAME: vpn-node-1
      TZ: Asia/Jakarta
    env_file:
      - .env
    networks:
      boss-network:
        # v0.8.1 — found genuinely unpinned while recreating this container
        # for the infra-tunnel-block migration: unlike node2/node3 (fixed
        # in v0.7.3 after the exact same "silently reassigned on
        # recreate" symptom), node1 had NEVER actually been pinned despite
        # .env.example's own comment CLAIMING it already was — container_name
        # fixes the container's NAME, not its network IP, and nothing had
        # recreated node1 since that comment was written to actually expose
        # the gap. Confirmed live: recreating node1 without this silently
        # grabbed 172.28.0.4 (wireguard-node2's own address), causing node2's
        # own recreate to fail with "Address already in use" right after.
        ipv4_address: ${WIREGUARD_NODE1_INTERNAL_IP}
    depends_on:
      freeradius:
        condition: service_healthy

  # v0.8.1 — OSPF sidecar, NODE role. network_mode: "service:wireguard"
  # means this container has NO network config of its own at all — it
  # fully shares wireguard's existing network namespace (same eth0, same
  # already-pinned WIREGUARD_NODE1_INTERNAL_IP, same wg0), so routes zebra
  # installs here apply directly to whatever actually routes packets for
  # the wireguard container — no cross-container route-copying mechanism
  # needed. See CLAUDE.md's OSPF section for the full design/rationale.
  # [v0.8.1 OSPF DISABLED — see CLAUDE.md "OSPF Dynamic Routing" for why. Kept for reference, not deleted.]
  # frr-wireguard:
  #   build:
  #     context: ./docker/frr
  #   container_name: frr-wireguard
  #   restart: unless-stopped
  #   network_mode: "service:wireguard"
  #   # NET_ADMIN/NET_BROADCAST/NET_RAW for OSPF itself (multicast Hello +
  #   # kernel route table writes); SYS_ADMIN found genuinely required by
  #   # zebra's own privilege-drop code during the resource-test phase
  #   # (container exited immediately with "privs_init: initial
  #   # cap_set_proc failed" until this was added — not assumed, verified).
  #   cap_add:
  #     - NET_ADMIN
  #     - NET_BROADCAST
  #     - NET_RAW
  #     - SYS_ADMIN
  #   environment:
  #     FRR_ROLE: node
  #     OSPF_HELLO_INTERVAL: ${OSPF_HELLO_INTERVAL:-1}
  #     OSPF_DEAD_INTERVAL: ${OSPF_DEAD_INTERVAL:-4}
  #     OSPF_AUTH_KEY: ${OSPF_AUTH_KEY}
  #     HANDSHAKE_FRESH_THRESHOLD_SECONDS: "150"
  #   volumes:
  #     # Same peers/addresses fragment volume the wireguard container's own
  #     # reconcile loop already reads/writes — handshake-watcher.sh derives
  #     # each NAS's router IP from these fragments, no DB access needed.
  #     - vpn_wg_data:/etc/wireguard
  #   depends_on:
  #     - wireguard

  # # --- v0.6.4 multi-node pool: node2/node3 for openvpn/wireguard ---
  # #
  # # Same build context/image as node1 above — only container_name, host
  # # port, and (for openvpn) the client subnet actually differ; the
  # # entrypoint script itself is 100% shared, no per-node variant needed.
  # #
  # # OpenVPN node2/node3 share `vpn_pki` with node1 (see CLAUDE.md "Multi-
  # # Node VPN Pool (v0.6.4)" for the full rationale) — a client certificate
  # # issued once is trusted by whichever of the 3 nodes it actually
  # # connects to, which is what makes the auto-switch Mikrotik script able
  # # to just change `connect-to`/`endpoint-address` on failover instead of
  # # re-importing credentials. `depends_on: openvpn` (not just
  # # `freeradius`) is deliberate — the shared PKI's one-time bootstrap
  # # (`if [ ! -f ca.crt ]`) must finish on node1 first, or two siblings
  # # racing to init the same empty volume at once could both "win" that
  # # check simultaneously.
  openvpn-node2:
    build:
      context: ./docker/openvpn
    container_name: openvpn-node2
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      - "1195:1194/udp"
    volumes:
      - vpn_pki:/etc/openvpn/pki-data
      - vpn_ccd:/etc/openvpn/ccd
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      # Node2's OWN client subnet, distinct from node1's 172.23.194.0/24 —
      # this node's ccd is never actually written to (see
      # VpnProvisioningService/VpnServer::poolOwnerFor()'s docblock: only
      # the pool owner, node1, ever gets a ccd entry for a given client),
      # so clients that fail over here always get a plain DYNAMIC
      # ifconfig-pool address from this subnet, not a static push — fine,
      # since the FreeRADIUS-only routing isolation never depends on the
      # specific internal_ip value.
      VPN_SUBNET_CIDR: 172.23.199.0/24
      VPN_SUBNET_NETWORK: 172.23.199.0
      VPN_SUBNET_NETMASK: 255.255.255.0
      NODE_HOSTNAME: vpn-node-2
      TZ: Asia/Jakarta
    env_file:
      - .env
    networks:
      - boss-network
    depends_on:
      openvpn:
        condition: service_started

  openvpn-node3:
    build:
      context: ./docker/openvpn
    container_name: openvpn-node3
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      - "1196:1194/udp"
    volumes:
      - vpn_pki:/etc/openvpn/pki-data
      - vpn_ccd:/etc/openvpn/ccd
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      VPN_SUBNET_CIDR: 172.23.200.0/24
      VPN_SUBNET_NETWORK: 172.23.200.0
      VPN_SUBNET_NETMASK: 255.255.255.0
      NODE_HOSTNAME: vpn-node-3
      TZ: Asia/Jakarta
    env_file:
      - .env
    networks:
      - boss-network
    depends_on:
      openvpn:
        condition: service_started

  # WireGuard node2/node3 share `vpn_wg_data` with node1 — NOT just the
  # peers directory but the server keypair file too, so all 3 nodes
  # present the IDENTICAL public key to clients. This matters more than it
  # does for OpenVPN: WireGuard's AllowedIPs/peer model has no equivalent
  # of "verify-server-certificate=no" to fall back on, and a client's own
  # `/interface wireguard peers` entry has the server's public-key baked
  # in — sharing the keypair means failover truly only needs an
  # endpoint-address/port change, never a peer public-key change. Each
  # node's reconcile loop independently applies the SAME shared peers/*.conf
  # files to its OWN wg0 — `depends_on: wireguard` again purely to avoid a
  # first-boot keygen race on the shared volume (see wireguard's own
  # entrypoint.sh: `if [ ! -f server_private.key ]`).
  wireguard-node2:
    build:
      context: ./docker/wireguard
    container_name: wireguard-node2
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "51821:51821/udp"
    volumes:
      - vpn_wg_data:/etc/wireguard
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      WG_LISTEN_PORT: 51821
      NODE_HOSTNAME: vpn-node-2
      TZ: Asia/Jakarta
    env_file:
      - .env
    networks:
      boss-network:
        # Pinned 2026-08-19 (was previously unpinned, the ONLY special-
        # purpose container in this stack without one) — found during the
        # Connection Request (v0.7.3) investigation: recreating this
        # container with no ipv4_address let Docker reassign its address,
        # which silently broke TR069_MANAGEMENT_GATEWAY (keyed off this
        # exact IP). Same "must not silently drift on container
        # recreation" reasoning as FREERADIUS_INTERNAL_IP/GENIEACS_*_
        # INTERNAL_IP.
        ipv4_address: ${WIREGUARD_NODE2_INTERNAL_IP}
    depends_on:
      wireguard:
        condition: service_started

  # v0.8.1 — OSPF sidecar, NODE role. Same shape as frr-wireguard above.
  # [v0.8.1 OSPF DISABLED — see CLAUDE.md "OSPF Dynamic Routing" for why. Kept for reference, not deleted.]
  # frr-wireguard-node2:
  #   build:
  #     context: ./docker/frr
  #   container_name: frr-wireguard-node2
  #   restart: unless-stopped
  #   network_mode: "service:wireguard-node2"
  #   cap_add:
  #     - NET_ADMIN
  #     - NET_BROADCAST
  #     - NET_RAW
  #     - SYS_ADMIN
  #   environment:
  #     FRR_ROLE: node
  #     OSPF_HELLO_INTERVAL: ${OSPF_HELLO_INTERVAL:-1}
  #     OSPF_DEAD_INTERVAL: ${OSPF_DEAD_INTERVAL:-4}
  #     OSPF_AUTH_KEY: ${OSPF_AUTH_KEY}
  #     HANDSHAKE_FRESH_THRESHOLD_SECONDS: "150"
  #   volumes:
  #     - vpn_wg_data:/etc/wireguard
  #   depends_on:
  #     - wireguard-node2

  wireguard-node3:
    build:
      context: ./docker/wireguard
    container_name: wireguard-node3
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "51822:51822/udp"
    volumes:
      - vpn_wg_data:/etc/wireguard
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      WG_LISTEN_PORT: 51822
      NODE_HOSTNAME: vpn-node-3
      TZ: Asia/Jakarta
    env_file:
      - .env
    networks:
      boss-network:
        # Pinned 2026-08-19 — see wireguard-node2's own comment above for
        # the full story (this node is the one that actually exposed the
        # bug: it holds test-x86-bajastu's real, live tunnel).
        ipv4_address: ${WIREGUARD_NODE3_INTERNAL_IP}
    depends_on:
      wireguard:
        condition: service_started

  # v0.8.1 — OSPF sidecar, NODE role. Same shape as frr-wireguard above —
  # this is the node test-x86-bajastu's live tunnel currently holds.
  # [v0.8.1 OSPF DISABLED — see CLAUDE.md "OSPF Dynamic Routing" for why. Kept for reference, not deleted.]
  # frr-wireguard-node3:
  #   build:
  #     context: ./docker/frr
  #   container_name: frr-wireguard-node3
  #   restart: unless-stopped
  #   network_mode: "service:wireguard-node3"
  #   cap_add:
  #     - NET_ADMIN
  #     - NET_BROADCAST
  #     - NET_RAW
  #     - SYS_ADMIN
  #   environment:
  #     FRR_ROLE: node
  #     OSPF_HELLO_INTERVAL: ${OSPF_HELLO_INTERVAL:-1}
  #     OSPF_DEAD_INTERVAL: ${OSPF_DEAD_INTERVAL:-4}
  #     OSPF_AUTH_KEY: ${OSPF_AUTH_KEY}
  #     HANDSHAKE_FRESH_THRESHOLD_SECONDS: "150"
  #   volumes:
  #     - vpn_wg_data:/etc/wireguard
  #   depends_on:
  #     - wireguard-node3

  l2tp:
    build:
      context: ./docker/l2tp
    container_name: l2tp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/ppp
    ports:
      - "500:500/udp"
      - "4500:4500/udp"
      - "1701:1701/udp"
    volumes:
      - vpn_l2tp_secrets:/etc/ppp/secrets-data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    environment:
      TZ: Asia/Jakarta
    env_file:
      - .env
    networks:
      - boss-network
    depends_on:
      freeradius:
        condition: service_healthy

  # --- v0.7.1 GenieACS (TR-069 CPE management) — mongo + 4 GenieACS
  # services, all built from docker/genieacs (npm-installed, no official
  # image exists — see that Dockerfile's own comment). ---

  mongo:
    image: mongo:8.0
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
      TZ: Asia/Jakarta
    volumes:
      - mongo_data:/data/db
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - boss-network
    # Own separate datastore for GenieACS (BOSS-009: never boss_db/
    # radius_db, no cross-database joins). Port 27017 SENGAJA TIDAK
    # di-expose ke host (RULE BOSS-010) — reserved for exactly this since
    # v0.1.0's own .env.example.

  genieacs-cwmp:
    build:
      context: ./docker/genieacs
    container_name: genieacs-cwmp
    restart: unless-stopped
    command: genieacs-cwmp
    # v0.7.3 — NET_ADMIN + entrypoint.sh's `ip route replace` for
    # Connection Request routing toward a NAS's TR-069 management subnet
    # (see docker/genieacs/entrypoint.sh).
    cap_add:
      - NET_ADMIN
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://${MONGO_DB_USER}:${MONGO_DB_PASSWORD}@mongo/${MONGO_DB_NAME}?authSource=admin
      GENIEACS_CWMP_INTERFACE: "0.0.0.0"
      GENIEACS_CWMP_PORT: "7547"
      TZ: Asia/Jakarta
    volumes:
      # v0.8.1 fragment+reconcile — read-only, see CLAUDE.md's "Fragment+
      # Reconcile Routing" section.
      - vpn_wg_data:/vpn-wg-data:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      boss-network:
        # Static IP (v0.7.3) — the new Connection Request firewall
        # exception in docker/wireguard/entrypoint.sh is keyed off this
        # exact address (GENIEACS_CWMP_INTERNAL_IP in .env), same "must
        # never silently drift on container recreation" reasoning as
        # FREERADIUS_INTERNAL_IP above — proven to actually happen for real
        # during the v0.7.2 timezone rollout (every container's bridge IP
        # reshuffled when the whole stack was recreated together).
        ipv4_address: ${GENIEACS_CWMP_INTERNAL_IP}
    # No host port here on purpose — boss-nginx is the actual public entry
    # point for CPE traffic (see its own service block + docker/nginx/
    # conf.d/genieacs-cwmp.conf), same "one public entry point" posture as
    # boss-app's own port-80 traffic.

  # v0.8.1 — OSPF sidecar, CONSUMER role. See frr-freeradius above.
  # [v0.8.1 OSPF DISABLED — see CLAUDE.md "OSPF Dynamic Routing" for why. Kept for reference, not deleted.]
  # frr-genieacs-cwmp:
  #   build:
  #     context: ./docker/frr
  #   container_name: frr-genieacs-cwmp
  #   restart: unless-stopped
  #   network_mode: "service:genieacs-cwmp"
  #   cap_add:
  #     - NET_ADMIN
  #     - NET_BROADCAST
  #     - NET_RAW
  #     - SYS_ADMIN
  #   environment:
  #     FRR_ROLE: consumer
  #     OSPF_HELLO_INTERVAL: ${OSPF_HELLO_INTERVAL:-1}
  #     OSPF_DEAD_INTERVAL: ${OSPF_DEAD_INTERVAL:-4}
  #     OSPF_AUTH_KEY: ${OSPF_AUTH_KEY}
  #   depends_on:
  #     - genieacs-cwmp

  genieacs-nbi:
    build:
      context: ./docker/genieacs
    container_name: genieacs-nbi
    restart: unless-stopped
    command: genieacs-nbi
    # v0.7.3 — same reasoning as genieacs-cwmp above.
    cap_add:
      - NET_ADMIN
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://${MONGO_DB_USER}:${MONGO_DB_PASSWORD}@mongo/${MONGO_DB_NAME}?authSource=admin
      GENIEACS_NBI_INTERFACE: "0.0.0.0"
      GENIEACS_NBI_PORT: "7557"
      TZ: Asia/Jakarta
    volumes:
      # v0.8.1 fragment+reconcile — read-only, see CLAUDE.md's "Fragment+
      # Reconcile Routing" section.
      - vpn_wg_data:/vpn-wg-data:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      boss-network:
        # Static IP (v0.7.3) — same reasoning as genieacs-cwmp above; the
        # Connection Request firewall exception needs both genieacs-cwmp
        # and genieacs-nbi's source IPs pinned (GENIEACS_NBI_INTERNAL_IP in
        # .env), since NBI is the one that actually issues the
        # connection_request HTTP call (CpeParameterResolverService /
        # NasController-style flows all go through genieacs-nbi, not cwmp,
        # for outbound calls to GenieACS's own REST API).
        ipv4_address: ${GENIEACS_NBI_INTERNAL_IP}
    # NO port mapping to the host AT ALL (unlike cwmp, not even proxied) —
    # genieacs-nbi's REST API has no authentication of its own, so network
    # isolation (container-to-container only, inside boss-network) IS its
    # security boundary. GenieAcsClientService (boss-app) reaches it at
    # http://genieacs-nbi:7557 — see config/services.php's `genieacs.nbi_url`.

  # v0.8.1 — OSPF sidecar, CONSUMER role. See frr-freeradius above.
  # [v0.8.1 OSPF DISABLED — see CLAUDE.md "OSPF Dynamic Routing" for why. Kept for reference, not deleted.]
  # frr-genieacs-nbi:
  #   build:
  #     context: ./docker/frr
  #   container_name: frr-genieacs-nbi
  #   restart: unless-stopped
  #   network_mode: "service:genieacs-nbi"
  #   cap_add:
  #     - NET_ADMIN
  #     - NET_BROADCAST
  #     - NET_RAW
  #     - SYS_ADMIN
  #   environment:
  #     FRR_ROLE: consumer
  #     OSPF_HELLO_INTERVAL: ${OSPF_HELLO_INTERVAL:-1}
  #     OSPF_DEAD_INTERVAL: ${OSPF_DEAD_INTERVAL:-4}
  #     OSPF_AUTH_KEY: ${OSPF_AUTH_KEY}
  #   depends_on:
  #     - genieacs-nbi

  genieacs-fs:
    build:
      context: ./docker/genieacs
    container_name: genieacs-fs
    restart: unless-stopped
    command: genieacs-fs
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://${MONGO_DB_USER}:${MONGO_DB_PASSWORD}@mongo/${MONGO_DB_NAME}?authSource=admin
      GENIEACS_FS_INTERFACE: "0.0.0.0"
      GENIEACS_FS_PORT: "7567"
      TZ: Asia/Jakarta
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - boss-network
    # Not wired into any v0.7.1 feature yet (firmware/config file
    # distribution to CPEs isn't this sub-version's scope) — included
    # because it's part of a standard GenieACS deployment, not because
    # anything calls it right now. No host port for the same "not needed
    # yet" reason.

  genieacs-ui:
    build:
      context: ./docker/genieacs
    container_name: genieacs-ui
    restart: unless-stopped
    command: genieacs-ui
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://${MONGO_DB_USER}:${MONGO_DB_PASSWORD}@mongo/${MONGO_DB_NAME}?authSource=admin
      GENIEACS_UI_INTERFACE: "0.0.0.0"
      GENIEACS_UI_PORT: "3000"
      GENIEACS_UI_JWT_SECRET: ${GENIEACS_UI_JWT_SECRET}
      TZ: Asia/Jakarta
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - boss-network
    # GenieACS's own bundled admin UI — optional, for manual debugging only;
    # BOSS App itself never talks to this (all binding/status logic goes
    # through genieacs-nbi directly). No host port published (BOSS-010
    # minimal-public-surface posture) — reach it via `docker compose exec`
    # or an SSH tunnel to port 3000 on boss-network if needed, not a public
    # port. Add one deliberately later if admins actually need routine
    # browser access to it.

  librenms-db:
    image: mariadb:10
    container_name: librenms-db
    restart: unless-stopped
    command:
      - "mysqld"
      - "--innodb-file-per-table=1"
      - "--lower-case-table-names=0"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      TZ: Asia/Jakarta
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${LIBRENMS_DB_NAME}
      MYSQL_USER: ${LIBRENMS_DB_USER}
      MYSQL_PASSWORD: ${LIBRENMS_DB_PASSWORD}
    volumes:
      - librenms_db_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - boss-network
    # v0.8.1 — own separate MariaDB instance (BOSS-009: never boss-postgresql,
    # which is PostgreSQL anyway and LibreNMS requires MySQL/MariaDB — no
    # cross-database joins, same posture as freeradius-db/mongo). Port 3306
    # deliberately NOT exposed to the host (RULE BOSS-010).

  librenms-redis:
    image: redis:7.2-alpine
    container_name: librenms-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    networks:
      - boss-network
    # v0.8.1 — LibreNMS's own cache/session store, deliberately separate
    # from boss-redis (used for boss-app's queues/cache/sessions) — same
    # "never share a datastore across unrelated services" posture as
    # librenms-db above, avoids any risk of key-eviction interference
    # between the two completely different workloads. No host port.

  librenms:
    image: librenms/librenms:latest
    container_name: librenms
    hostname: librenms
    restart: unless-stopped
    # Required by the official image itself for SNMP/ICMP-based discovery
    # and polling (raw sockets) — same class of requirement as
    # genieacs-cwmp/genieacs-nbi's NET_ADMIN above, just for a different
    # underlying reason (SNMP/ping, not routing table manipulation).
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # v0.8.1 — wraps (never replaces) the official image's own /init with a
    # fragment+reconcile route-sync loop — this container has no custom
    # Dockerfile of our own (official librenms/librenms:latest), so the
    # route-adding script is bind-mounted in instead of baked into an image
    # layer. See docker/librenms/route-init.sh for the full reasoning and
    # CLAUDE.md's "LibreNMS OLT Onboarding"/"Fragment+Reconcile Routing"
    # sections.
    entrypoint: ["/route-init.sh"]
    environment:
      TZ: Asia/Jakarta
      PUID: "1000"
      PGID: "1000"
      DB_HOST: librenms-db
      DB_NAME: ${LIBRENMS_DB_NAME}
      DB_USER: ${LIBRENMS_DB_USER}
      DB_PASSWORD: ${LIBRENMS_DB_PASSWORD}
      DB_TIMEOUT: "60"
      REDIS_HOST: librenms-redis
      CACHE_DRIVER: redis
    volumes:
      - librenms_data:/data
      - ./docker/librenms/route-init.sh:/route-init.sh:ro
      # v0.8.1 fragment+reconcile — read-only, see CLAUDE.md's "Fragment+
      # Reconcile Routing" section.
      - vpn_wg_data:/vpn-wg-data:ro
      # Deliberately NO /etc/localtime or /etc/timezone bind mount here,
      # unlike every other service in this file — real bug found bringing
      # this up: the official librenms/docker image's own init script
      # (03-config.sh) tries to CREATE the /etc/localtime symlink itself
      # from the TZ env var above; a read-only bind mount at that same
      # path makes that `ln` fail ("Resource busy"), which crash-loops the
      # whole container (s6-init treats it as a fatal init script
      # failure). The other services' pattern assumes an image with no
      # opinion of its own about /etc/localtime — this image has one.
    depends_on:
      - librenms-db
      - librenms-redis
    networks:
      boss-network:
        # Static IP (v0.8.1) — inside INFRA_TUNNEL_BLOCK_CIDR (.env), same
        # "must not silently drift on container recreation" reasoning as
        # FREERADIUS_INTERNAL_IP/GENIEACS_*_INTERNAL_IP above. Needed here
        # (not just on librenms-dispatcher) because `POST /api/v0/devices`'
        # own add-time reachability check runs synchronously in THIS
        # container, not delegated to the dispatcher — confirmed for real
        # while diagnosing the OLT onboarding gap (a device add attempt
        # failed with "Could not ping ..." from this exact container).
        ipv4_address: ${LIBRENMS_INTERNAL_IP}
    # v0.8.1 — web UI + core app. Deliberately NO host port published here
    # (unlike the official example's `8000:8000`) — same posture as
    # genieacs-ui above (BOSS-010 minimal-public-surface): reach it via
    # `docker compose exec librenms ...` for CLI/API-token work, or an SSH
    # tunnel to port 8000 on boss-network for occasional browser access
    # during this evaluation sprint. Revisit only if v0.8.2 deliberately
    # wires it behind boss-nginx as a real, permanent public surface.

  # v0.8.1 — OSPF sidecar, CONSUMER role. See frr-freeradius above.
  # [v0.8.1 OSPF DISABLED — see CLAUDE.md "OSPF Dynamic Routing" for why. Kept for reference, not deleted.]
  # frr-librenms:
  #   build:
  #     context: ./docker/frr
  #   container_name: frr-librenms
  #   restart: unless-stopped
  #   network_mode: "service:librenms"
  #   cap_add:
  #     - NET_ADMIN
  #     - NET_BROADCAST
  #     - NET_RAW
  #     - SYS_ADMIN
  #   environment:
  #     FRR_ROLE: consumer
  #     OSPF_HELLO_INTERVAL: ${OSPF_HELLO_INTERVAL:-1}
  #     OSPF_DEAD_INTERVAL: ${OSPF_DEAD_INTERVAL:-4}
  #     OSPF_AUTH_KEY: ${OSPF_AUTH_KEY}
  #   depends_on:
  #     - librenms

  librenms-dispatcher:
    image: librenms/librenms:latest
    container_name: librenms-dispatcher
    hostname: librenms-dispatcher
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # v0.8.1 — same route-init wrapper as librenms above (see its own
    # comment + docker/librenms/route-init.sh). This is the container that
    # actually issues the ongoing SNMP polls, so it needs this route just
    # as much as librenms itself does for its add-time check.
    entrypoint: ["/route-init.sh"]
    environment:
      TZ: Asia/Jakarta
      PUID: "1000"
      PGID: "1000"
      DB_HOST: librenms-db
      DB_NAME: ${LIBRENMS_DB_NAME}
      DB_USER: ${LIBRENMS_DB_USER}
      DB_PASSWORD: ${LIBRENMS_DB_PASSWORD}
      DB_TIMEOUT: "60"
      REDIS_HOST: librenms-redis
      CACHE_DRIVER: redis
      DISPATCHER_NODE_ID: dispatcher1
      SIDECAR_DISPATCHER: "1"
    volumes:
      - librenms_data:/data
      - ./docker/librenms/route-init.sh:/route-init.sh:ro
      # v0.8.1 fragment+reconcile — read-only, see CLAUDE.md's "Fragment+
      # Reconcile Routing" section.
      - vpn_wg_data:/vpn-wg-data:ro
      # No /etc/localtime bind mount — same real crash-loop bug as the
      # librenms service above, see its own comment for the full story.
    depends_on:
      - librenms
      - librenms-redis
    networks:
      boss-network:
        # Static IP (v0.8.1) — inside INFRA_TUNNEL_BLOCK_CIDR (.env). This
        # is the container that actually issues the outbound SNMP polls
        # (librenms-service.py, SIDECAR_DISPATCHER=1), so its source IP is
        # what the router's tunnel allowlist genuinely needs to trust for
        # ongoing polling, same reasoning as librenms itself above for
        # add-time reachability checks.
        ipv4_address: ${LIBRENMS_DISPATCHER_INTERNAL_IP}
    # v0.8.1 — the actual SNMP poller (SIDECAR_DISPATCHER=1). Without this
    # container, `librenms` alone serves the web UI but never polls a
    # single device — confirmed from the official librenms/docker compose
    # reference, which always ships this as a separate sidecar. msmtpd/
    # syslogng/snmptrapd sidecars deliberately NOT added — out of scope
    # for this install-and-onboard-only sprint (no email alerting, no
    # syslog/trap ingestion needed to prove basic uptime/interface polling
    # works).

  # v0.8.1 — OSPF sidecar, CONSUMER role. See frr-freeradius above. This
  # is the container that actually issues the SNMP polls, so it needs the
  # OSPF-learned OLT route just as much as librenms itself does for its
  # add-time reachability check.
  # [v0.8.1 OSPF DISABLED — see CLAUDE.md "OSPF Dynamic Routing" for why. Kept for reference, not deleted.]
  # frr-librenms-dispatcher:
  #   build:
  #     context: ./docker/frr
  #   container_name: frr-librenms-dispatcher
  #   restart: unless-stopped
  #   network_mode: "service:librenms-dispatcher"
  #   cap_add:
  #     - NET_ADMIN
  #     - NET_BROADCAST
  #     - NET_RAW
  #     - SYS_ADMIN
  #   environment:
  #     FRR_ROLE: consumer
  #     OSPF_HELLO_INTERVAL: ${OSPF_HELLO_INTERVAL:-1}
  #     OSPF_DEAD_INTERVAL: ${OSPF_DEAD_INTERVAL:-4}
  #     OSPF_AUTH_KEY: ${OSPF_AUTH_KEY}
  #   depends_on:
  #     - librenms-dispatcher

  boss-postgresql:
    image: postgres:16-alpine
    container_name: boss-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - boss_postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - boss-network
    # Port 5432 SENGAJA TIDAK di-expose ke host (RULE BOSS-010)

  boss-redis:
    image: redis:7-alpine
    container_name: boss-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: Asia/Jakarta
    volumes:
      - boss_redis_data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - boss-network
    # Port 6379 SENGAJA TIDAK di-expose ke host (RULE BOSS-010)

networks:
  boss-network:
    driver: bridge
    ipam:
      config:
        # v0.6.2 — a fixed subnet so freeradius can be pinned to a static
        # ipv4_address (see its service block above). Distinct from
        # VPN_SUBNET_CIDR (the OpenVPN client pool, 172.23.194.0/24) to
        # avoid any address overlap between "containers on boss-network"
        # and "NAS clients tunneled in over OpenVPN".
        - subnet: 172.28.0.0/24

volumes:
  boss_postgres_data:
  boss_redis_data:
  freeradius_postgres_data:
  vpn_pki:
  vpn_ccd:
  vpn_wg_data:
  vpn_l2tp_secrets:
  mongo_data:
  freeradius_nas_config:
  librenms_db_data:
  librenms_data:
  # v0.8.4 — boss.bajastu.id activation, the first real TLS deployment in
  # this project (v0.1.0-foundation deliberately deferred it, see
  # docs/DEPLOYMENT.md's own "HTTPS (menyusul)" note). certbot_conf holds
  # the actual Let's Encrypt account/certificate state (/etc/letsencrypt);
  # certbot_www is the shared webroot both boss-nginx and the certbot
  # container use for the HTTP-01 ACME challenge — same "shared Docker
  # volume between two containers" pattern already used everywhere else
  # in this project (vpn_pki, freeradius_nas_config, etc.), not a new
  # mechanism.
  certbot_conf:
  certbot_www:
