server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # --- Uncomment blok ini setelah domain + TLS siap (lihat docs/DEPLOYMENT.md) ---
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }
    # return 301 https://$host$request_uri;
    # ---------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass boss-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/boss-app.access.log;
    error_log  /var/log/nginx/boss-app.error.log;
}
