# v0.8.4 — boss.bajastu.id activation (docs/DEPLOYMENT.md's "HTTPS
# (menyusul, belum di v0.1.0)" section, finally executed). Two-phase
# rollout, same bootstrapping order Certbot's own docs recommend for
# nginx+webroot: this file (port 80 only — ACME challenge + redirect to
# HTTPS) is added and nginx reloaded FIRST, so the HTTP-01 challenge can
# actually be solved; the port 443 server block lives in a SEPARATE file
# (boss-domain-ssl.conf) added only once the certificate genuinely exists
# on disk — nginx refuses to start at all if `ssl_certificate` points at
# a file that isn't there yet, so the two can't be in the same file
# rolled out atomically.
#
# app.conf's own `server_name _;` catch-all block is completely
# untouched by this file — IP-based access (http://45.123.142.242)
# keeps working exactly as before, unredirected. nginx picks the more
# specific server_name (this block) over the `_` catch-all whenever the
# request's Host header is actually boss.bajastu.id.
server {
    listen 80;
    server_name boss.bajastu.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
