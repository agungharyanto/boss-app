user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

# v0.7.1 amendment — TCP-level (not HTTP-level) passthrough for genieacs-cwmp
# (port 7547). Must be top-level, sibling to http{} — cannot live inside
# conf.d since that's include'd from within the http{} block below. See
# docker/nginx/stream.conf.d/genieacs-cwmp.conf and CLAUDE.md "GenieACS Core
# (v0.7.1)" for why.
stream {
    include /etc/nginx/stream.conf.d/*.conf;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    include /etc/nginx/conf.d/*.conf;
}
