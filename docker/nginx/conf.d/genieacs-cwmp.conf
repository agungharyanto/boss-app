# v0.7.1 — CPE devices (ONT/router) dial this port to send TR-069 Inform
# requests. Fronted by boss-nginx (like boss-app's own port-80 block)
# instead of publishing genieacs-cwmp's port directly, per the locked
# decision to prefer an HTTP(S) reverse proxy over exposing a raw TR-069
# port straight to the internet where it can be avoided — see CLAUDE.md
# "GenieACS Core (v0.7.1)". genieacs-nbi is the opposite: it has NO host
# port at all, not even proxied, because unlike cwmp it's never meant to be
# reached from outside boss-network in the first place.
server {
    listen 7547;
    server_name _;

    location / {
        proxy_pass http://genieacs-cwmp:7547;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/genieacs-cwmp.access.log;
    error_log  /var/log/nginx/genieacs-cwmp.error.log;
}
