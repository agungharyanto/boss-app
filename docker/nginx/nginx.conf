user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

# v0.7.1 amendment — TCP-level (not HTTP-level) passthrough for genieacs-cwmp
# (port 7547). Must be top-level, sibling to http{} — cannot live inside
# conf.d since that's include'd from within the http{} block below. See
# docker/nginx/stream.conf.d/genieacs-cwmp.conf and CLAUDE.md "GenieACS Core
# (v0.7.1)" for why.
stream {
    include /etc/nginx/stream.conf.d/*.conf;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    # v0.16.0 Langkah 6 — raised 20M -> 25M to sit at/above PHP's
    # post_max_size (docker/php/conf.d/zz-boss-uploads.ini) so the two
    # gates agree; headroom for a small multi-photo Livewire upload batch
    # of ~20M phone JPEGs. Was never the cause of the "failed to upload"
    # bug (that was PHP's 2M default), just kept aligned.
    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    include /etc/nginx/conf.d/*.conf;
}
